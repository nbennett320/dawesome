[package]
authors = ["you"]
default-run = "app"
description = "dawesome/engine"
edition = "2021"
license = "MIT"
name = "app"
repository = "https://github.com/nbennett320/dawesome"
rust-version = "1.86"
version = "0.1.1"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# already a dependency of tauri
base64 = "0.13"
chrono = "0.4"
futures = "0.3.21"
futures-test = "0.3.21"
rodio = "0.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
svg = "0.10.0"
# macos-private-api: lets the webview skip its own white background, so the
# window opens in the theme's color (not allowed in the Mac App Store)
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# where settings and recent projects are saved (Tauri 1's tauri::api::path)
dirs = "6"
num-traits = "0.2.15"
lazy_static = "1.4.0"
hound = "3.5.0"
symphonia = "0.5.1"
mlua = { version = "*", features = [ "lua54", "vendored" ] }
rtrb = "0.3"
trash = "~5.2.3"  # 5.3 needs rustc 1.87
# MP3s for mixdowns (builds its own LAME, which is LGPL)
mp3lame-encoder = "0.3.0"
# VST3 plugins: bindings generated from the SDK's headers (we write the host)
vst3 = "0.3"

# opening a plugin's bundle (macOS) or library (Linux, Windows)
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
# plugin editors' windows, and docking them in the main window
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSGeometry", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std", "NSGraphics", "NSPanel", "NSResponder", "NSScreen", "NSView", "NSWindow",
] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
libloading = "0.7"

[target.'cfg(target_os = "linux")'.dependencies]
pulse = { version = "2.26.*", package= "libpulse-binding" }
psimple = { version="2.25.*", package="libpulse-simple-binding" }

# the app and its events, for the windows tests/plugins.rs opens
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std", "NSData", "NSDate", "NSDictionary", "NSRunLoop",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std", "NSApplication", "NSBitmapImageRep", "NSEvent", "NSImageRep", "NSRunningApplication",
] }

# checks against the plugins installed on this machine. its own main runs
# them on the process's main thread, which plugins expect; they only run when
# asked: cargo test --no-default-features --test plugins -- --ignored
[[test]]
name = "plugins"
harness = false

[features]
# turned on by `tauri build`, which embeds ../dist. without it (`tauri dev`,
# `cargo run`, `cargo test`) the app loads the dev server instead
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
debug = 0
incremental = false
lto = true
opt-level = 3
overflow-checks = false
panic = "abort"

# unsupported optimiaztion for rust versions < 1.59
strip = "debuginfo"
