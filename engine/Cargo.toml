[package]
authors = ["you"]
default-run = "app"
description = "dawesome/engine"
edition = "2021"
license = "MIT"
name = "app"
repository = "https://github.com/nbennett320/dawesome"
rust-version = "1.86"
version = "0.1.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# already a dependency of tauri
base64 = "0.13"
chrono = "0.4"
futures = "0.3.21"
futures-test = "0.3.21"
rodio = "0.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
svg = "0.10.0"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# where settings and recent projects are saved (Tauri 1's tauri::api::path)
dirs = "6"
num-traits = "0.2.15"
lazy_static = "1.4.0"
hound = "3.5.0"
symphonia = "0.5.1"
mlua = { version = "*", features = [ "lua54" ] }
rtrb = "0.3"
trash = "~5.2.3"  # 5.3 needs rustc 1.87

[target.'cfg(target_os = "linux")'.dependencies]
pulse = { version = "2.26.*", package= "libpulse-binding" }
psimple = { version="2.25.*", package="libpulse-simple-binding" }

[features]
# turned on by `tauri build`, which embeds ../dist. without it (`tauri dev`,
# `cargo run`, `cargo test`) the app loads the dev server instead
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
debug = 0
incremental = false
lto = true
opt-level = 3
overflow-checks = false
panic = "abort"

# unsupported optimiaztion for rust versions < 1.59
strip = "debuginfo"
