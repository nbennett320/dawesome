name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-tests:
    name: UI tests (jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ui:test

  engine-tests:
    name: Engine tests (cargo)
    # Tauri v1 needs webkit2gtk-4.0, which ubuntu-24.04 no longer ships
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.0-dev libayatana-appindicator3-dev librsvg2-dev \
            libasound2-dev libpulse-dev liblua5.4-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      # Tauri embeds ../dist at compile time; tests don't need the real UI build
      - name: Stub frontend dist
        run: mkdir -p ../dist && echo '<!doctype html>' > ../dist/index.html
      - run: cargo test
