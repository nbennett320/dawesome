name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-tests:
    name: UI tests (jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ui:test

  engine-tests:
    name: Engine tests (cargo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      # Tauri 2's Linux prerequisites, plus the audio and Lua libraries
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev \
            libasound2-dev libpulse-dev liblua5.4-dev pkg-config
      # the oldest Rust the engine supports (rust-version in Cargo.toml)
      - uses: dtolnay/rust-toolchain@1.86
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - run: cargo test
